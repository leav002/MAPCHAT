<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - MAPCHAT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/styles/login.css') }}">
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <a href="/">
                <img src="{{ url_for('static', filename='assets/images/logo.png') }}" alt="MAPCHAT Logo" />
            </a>
            <h1>MAPCHAT</h1>
        </div>
        <form class="login-form" action="/sign-in" method="post">
            <div class="form-group">
                <label for="username">사용자 이름</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="login-button">로그인</button>
        </form>
        <div class="links">
            <a href="/sign-up">회원가입</a>
        </div>
    </div>
</body>

</html>
