<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - MAPCHAT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/styles/signup.css') }}">
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <a href="/">
                <img src="{{ url_for('static', filename='assets/images/logo.png') }}" alt="MAPCHAT Logo" />
            </a>
            <h1>회원가입</h1>
        </div>
        <form class="login-form" action="/sign-up" method="post">
            <div class="form-group">
                <label for="username">사용자 이름</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" name="nickname" required>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">비밀번호 확인</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>
            <button type="submit" class="login-button">회원가입</button>
        </form>
        <div class="links">
            <a href="/sign-in">로그인 페이지로</a>
        </div>
    </div>
</body>

</html>
