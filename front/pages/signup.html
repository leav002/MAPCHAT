<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - MAPCHAT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body class="auth-page">
    <div class="login-container">
        <div class="login-header">
            <a href="/"><h1>MAPCHAT</h1></a>
            <p>새로운 계정 만들기</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash-msg {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form class="login-form" action="/sign-up" method="post">
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" required placeholder="영문/숫자 조합">
            </div>
            <div class="form-group">
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" name="nickname" required placeholder="채팅에서 보여질 이름">
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" required placeholder="최소 6자 이상">
            </div>
            <button type="submit" class="login-button">회원가입 완료</button>
        </form>
        <div class="links">
            이미 계정이 있나요? <a href="/sign-in">로그인</a>
        </div>
    </div>
</body>
</html>
