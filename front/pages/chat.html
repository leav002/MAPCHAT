<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPCHAT - {{ room.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body class="chat-page-body">
    <header>
        <div class="header-content">
            <div class="logo-area">
                <a href="/"><h1>MAPCHAT</h1></a>
            </div>
            <div class="room-title">
                <h2>{{ room.name }}</h2>
            </div>
            <nav>
                <a href="{{ url_for('map_page') }}" style="text-decoration: none; color: #007bff;">지도로 가기</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="chat-container">
            <ul id="messages">
                {% for msg in messages %}
                    <li class="{% if msg.user_id == session['user_id'] %}mine{% else %}others{% endif %}">
                        <div style="font-size: 0.7em; opacity: 0.8; margin-bottom: 4px;">{{ msg.author.nickname }}</div>
                        {% if msg.text %}<p style="margin:0;">{{ msg.text }}</p>{% endif %}
                        {% if msg.image_url %}<img src="{{ msg.image_url }}" style="max-width: 100%; border-radius: 8px; margin-top: 5px;" />{% endif %}
                    </li>
                {% endfor %}
            </ul>

            <div class="chat-input-area">
                <div id="error-display" style="color: red; font-size: 0.8em; display: none; margin-bottom: 5px;"></div>
                <div class="input-controls">
                    <label style="cursor: pointer; font-size: 1.5em;">📷
                        <input type="file" id="image-upload" accept="image/*" style="display: none;">
                    </label>
                    <input type="text" id="message-input" placeholder="메시지를 입력하세요..." autocomplete="off">
                    <button id="send-button">전송</button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const ROOM_ID = {{ room.id }};
        const USER_ID = {{ session['user_id'] or 'null' }};
        const IS_LOGGED_IN = {{ 'true' if 'user_id' in session else 'false' }};
    </script>
    <script src="{{ url_for('static', filename='assets/js/chat.js') }}"></script>
</body>
</html>
