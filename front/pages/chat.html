<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - {{ room.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <style>
        body { display: flex; flex-direction: column; height: 100vh; }
        header { flex-shrink: 0; }
        main { flex-grow: 1; padding: 1rem; display: flex; flex-direction: column; overflow-y: auto; }
        #messages { list-style-type: none; margin: 0; padding: 0; flex-grow: 1; overflow-y: auto; }
        #messages li { padding: 0.5rem 1rem; }
        #messages li:nth-child(odd) { background: #f1f1f1; }
        .message-form { display: flex; padding: 1rem; background: #fff; }
        .message-form input { flex-grow: 1; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
        .message-form button { padding: 0.5rem 1rem; margin-left: 0.5rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .status-msg { text-align: center; color: #888; font-style: italic; }
        .user-msg .author { font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <div>
            <div class="logo-area">
                <a href="/">
                    <h1>MAPCHAT</h1>
                </a>
            </div>
            <h2>{{ room.name }}</h2>
            <div class="auth-buttons">
                <a href="{{ url_for('index') }}">Back to Map</a>
            </div>
        </div>
    </header>

    <main>
        <ul id="messages">
            {% for msg in messages %}
            <li class="user-msg">
                <span class="author">{{ msg.author.nickname or msg.author.username }}:</span>
                <span class="text">{{ msg.text }}</span>
            </li>
            {% endfor %}
        </ul>
    </main>

    <div class="message-form">
        <input id="message-input" autocomplete="off" placeholder="Type a message..." />
        <button id="send-button">Send</button>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        // Pass data from Flask template to JavaScript
        const ROOM_ID = {{ room.id }};
        const CURRENT_USER = {
            id: {{ session['user_id'] }},
            username: "{{ session['username'] }}",
            nickname: "{{ session['nickname'] or session['username'] }}"
        };
    </script>
    <script src="{{ url_for('static', filename='assets/js/chat.js') }}"></script>
</body>
</html>
