<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPCHAT - My Chats</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">

</head>

<body>
    <header>
        <div class="header-content">
            <div class="logo-area">
                <a href="/">
                    <img src="{{ url_for('static', filename='assets/images/logo.png') }}" alt="MAPCHAT Logo" />
                    <h1>MAPCHAT</h1>
                </a>
            </div>
            <nav>
                <ul>
                    <li><a href="{{ url_for('map_page') }}">지도</a></li>
                    <li><a href="{{ url_for('index') }}" style="font-weight: bold; color: #7DD3FC;">내 채팅</a></li>
                </ul>
            </nav>
            <div class="auth-buttons">
                {% if user %}
                <span class="user-info">{{ user.username }} / {{ user.nickname }}</span>
                <a href="{{ url_for('logout') }}">로그아웃</a>
                {% else %}
                <a href="{{ url_for('sign_in') }}">로그인</a>
                <a href="{{ url_for('sign_up') }}">회원가입</a>
                {% endif %}
            </div>
        </div>
    </header>
    <main>
        {% if user %}
        <section>
            <h2>내 채팅방</h2>
            <div id="my-rooms-container">
                <p style="color: #94a3b8; font-size:0.9rem;">위치 정보를 가져오는 중...</p>
            </div>
        </section>
        <section style="margin-top: 32px;">
            <h2>주변 채팅방 <span id="nearby-count" style="font-size:0.9rem; color:#94a3b8; font-weight:400;"></span></h2>
            <div id="nearby-rooms-container">
                <p style="color: #94a3b8; font-size:0.9rem;">위치 정보를 가져오는 중...</p>
            </div>
        </section>
        {% else %}
            <p>채팅방을 보려면 <a href="{{ url_for('sign_in') }}">로그인</a>하세요.</p>
        {% endif %}
    </main>
    <footer>
        &copy; 2024 MAPCHAT
    </footer>

    <script>
    const IS_LOGGED_IN = {{ 'true' if user else 'false' }};

    if (IS_LOGGED_IN) {
        function formatDist(m) {
            if (m == null) return '';
            return m >= 1000 ? (m / 1000).toFixed(1) + 'km' : m + 'm';
        }

        function buildRoomList(rooms, emptyMsg) {
            if (!rooms.length) {
                return `<p style="color:#94a3b8; font-size:0.9rem;">${emptyMsg}</p>`;
            }
            const ul = document.createElement('ul');
            ul.className = 'chat-room-list';
            rooms.forEach(room => {
                const li = document.createElement('li');
                const dist = formatDist(room.distance);
                const date = room.created_at ? room.created_at.substring(0, 10) : '';
                li.innerHTML = `
                    <a href="/chat/${room.id}">${room.name}</a>
                    <div style="text-align:right; font-size:0.8rem; color:#94a3b8; line-height:1.7">
                        ${dist ? `<span style="color:#3b82f6;">📍 ${dist}</span><br>` : ''}
                        <span>${date}</span>
                    </div>`;
                ul.appendChild(li);
            });
            return ul.outerHTML;
        }

        function loadAll(lat, lng) {
            const myUrl    = lat != null ? `/api/my-rooms?lat=${lat}&lng=${lng}` : '/api/my-rooms';
            const nearUrl  = lat != null ? `/api/nearby-rooms?lat=${lat}&lng=${lng}` : null;

            fetch(myUrl)
                .then(r => r.json())
                .then(rooms => {
                    document.getElementById('my-rooms-container').innerHTML =
                        buildRoomList(rooms, '아직 참여한 채팅방이 없습니다. <a href="/map">지도</a>에서 찾아보세요!');
                })
                .catch(() => {
                    document.getElementById('my-rooms-container').innerHTML =
                        '<p style="color:#dc2626;">불러오지 못했습니다.</p>';
                });

            if (nearUrl) {
                fetch(nearUrl)
                    .then(r => r.json())
                    .then(rooms => {
                        document.getElementById('nearby-count').textContent =
                            rooms.length ? `1km 이내 ${rooms.length}개` : '';
                        document.getElementById('nearby-rooms-container').innerHTML =
                            buildRoomList(rooms, '1km 이내에 참여 가능한 채팅방이 없습니다.');
                    })
                    .catch(() => {
                        document.getElementById('nearby-rooms-container').innerHTML =
                            '<p style="color:#dc2626;">불러오지 못했습니다.</p>';
                    });
            } else {
                document.getElementById('nearby-rooms-container').innerHTML =
                    '<p style="color:#94a3b8; font-size:0.9rem;">위치 정보가 없어 주변 방을 표시할 수 없습니다.</p>';
            }
        }

        if ('geolocation' in navigator) {
            navigator.geolocation.getCurrentPosition(
                pos => loadAll(pos.coords.latitude, pos.coords.longitude),
                ()  => loadAll(null, null),
                { timeout: 5000 }
            );
        } else {
            loadAll(null, null);
        }
    }
    </script>
</body>

</html>
